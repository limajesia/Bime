
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIME | Moda feminina</title>

<style>
:root {
  --azul: #dcecf4;
  --azul-escuro: #66899c;
  --texto: #303b40;
  --fundo: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: var(--fundo);
  color: var(--texto);
}

header {
  height: 76px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #edf1f3;
}

.logo {
  font-family: Georgia, serif;
  font-size: 30px;
  letter-spacing: 7px;
  color: #506f80;
}

.header-link {
  border: none;
  background: none;
  color: var(--texto);
  font-size: 13px;
  cursor: pointer;
}

.hero {
  min-height: 470px;
  background:
    linear-gradient(rgba(20,30,35,.25), rgba(20,30,35,.25)),
    url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=1600") center 35% / cover;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}

.hero h1 {
  color: white;
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: clamp(34px, 6vw, 62px);
  text-shadow: 0 2px 12px #3338;
}

.intro {
  text-align: center;
  padding: 55px 20px 25px;
}

.intro h2,
.category-heading h2 {
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: normal;
}

.intro p {
  margin-top: 12px;
  color: #849198;
  font-size: 13px;
}

.categories {
  max-width: 1050px;
  margin: 25px auto 75px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.category {
  min-height: 110px;
  border: 1px solid #e3edf2;
  background: #f7fbfd;
  color: #536f7e;
  font-family: Georgia, serif;
  font-size: 22px;
  cursor: pointer;
  transition: .2s;
}

.category:hover {
  background: var(--azul);
  border-color: #c5dce8;
}

footer {
  padding: 30px 15px;
  text-align: center;
  border-top: 1px solid #edf1f3;
  color: #91a0a7;
  font-size: 11px;
  letter-spacing: 2px;
}

.page {
  display: none;
  min-height: 65vh;
  padding: 45px 7% 75px;
}

.page.active {
  display: block;
}

.back {
  border: none;
  background: none;
  color: var(--azul-escuro);
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 35px;
}

.category-heading {
  text-align: center;
  margin-bottom: 40px;
}

.category-heading p {
  color: #91a0a7;
  font-size: 13px;
  margin-top: 10px;
}

.products {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 25px 18px;
  max-width: 1100px;
  margin: auto;
}

.product {
  cursor: pointer;
}

.product-photo {
  width: 100%;
  aspect-ratio: 3 / 4;
  background: linear-gradient(145deg, #f1f6f8, #e2edf2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #91aab6;
  font-family: Georgia, serif;
  font-size: 17px;
}

.product-info {
  padding: 13px 2px;
}

.product-info h3 {
  font-family: Georgia, serif;
  font-size: 17px;
  font-weight: normal;
  margin-bottom: 7px;
}

.price {
  font-size: 13px;
  color: #718995;
}

.product-detail {
  max-width: 850px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}

.detail-photo {
  aspect-ratio: 3 / 4;
  background: linear-gradient(145deg, #f1f6f8, #e2edf2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #91aab6;
  font-family: Georgia, serif;
  font-size: 20px;
}

.detail-info h2 {
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: 32px;
  margin-bottom: 15px;
}

.detail-info p {
  color: #849198;
  line-height: 1.7;
  margin: 15px 0;
  font-size: 14px;
}

.reserve {
  margin-top: 20px;
  width: 100%;
  padding: 16px;
  background: #dcecf4;
  border: 1px solid #c9dfe9;
  color: #496b7c;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
}

.reserve:hover {
  background: #cbdfe9;
}

.empty {
  text-align: center;
  color: #849198;
  padding: 50px 15px;
}

@media (max-width: 650px) {
  .hero {
    min-height: 390px;
  }

  .categories {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .category {
    min-height: 95px;
    font-size: 19px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px 12px;
  }

  .page {
    padding: 30px 5% 55px;
  }

  .product-detail {
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .detail-info h2 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BIME</div>
  <button class="header-link" onclick="goHome()">COLEÇÃO</button>
</header>

<main id="home">
  <section class="hero">
    <h1>Elegância em cada detalhe.</h1>
  </section>

  <section class="intro">
    <h2>Explore a coleção</h2>
    <p>Encontre peças que combinam com você.</p>
  </section>

  <section class="categories">
    <button class="category" onclick="openCategory('Vestidos')">Vestidos</button>
    <button class="category" onclick="openCategory('Blusas')">Blusas</button>
    <button class="category" onclick="openCategory('Macacões')">Macacões</button>
    <button class="category" onclick="openCategory('Shorts')">Shorts</button>
    <button class="category" onclick="openCategory('Pijamas')">Pijamas</button>
    <button class="category" onclick="openCategory('Saias')">Saias</button>
  </section>
</main>

<section id="categoryPage" class="page">
  <button class="back" onclick="goHome()">← Voltar à coleção</button>

  <div class="category-heading">
    <h2 id="categoryTitle"></h2>
    <p>Conheça nossa seleção.</p>
  </div>

  <div id="productGrid" class="products"></div>
</section>

<section id="productPage" class="page">
  <button class="back" onclick="backToCategory()">← Voltar à categoria</button>

  <div class="product-detail">
    <div class="detail-photo">Foto do produto</div>

    <div class="detail-info">
      <h2 id="detailName"></h2>
      <div class="price" id="detailPrice"></div>
      <p>Uma peça selecionada pela Bime para compor sua coleção.</p>
      <p>Gostou? Faça sua reserva e entraremos em contato para confirmar a disponibilidade.</p>
      <button class="reserve" onclick="reserveProduct()">RESERVAR PEÇA</button>
    </div>
  </div>
</section>

<footer>
  BIME · MODA FEMININA
</footer>

<script>
const products = [
  {name:"Vestido longo preto", category:"Vestidos", price:"R$ 150,00", image:"vestido longo.jpg"},
  {name:"Vestido Serena", category:"Vestidos", price:"R$ 319,90"},

  {name:"Blusa Clara", category:"Blusas", price:"R$ 149,90"},
  {name:"Blusa Amélia", category:"Blusas", price:"R$ 169,90"},

  {name:"Macacão Lívia", category:"Macacões", price:"R$ 329,90"},
  {name:"Macacão Elisa", category:"Macacões", price:"R$ 349,90"},

  {name:"Shorts Brisa", category:"Shorts", price:"R$ 179,90"},
  {name:"Shorts Alana", category:"Shorts", price:"R$ 189,90"},

  {name:"Pijama Nuvem", category:"Pijamas", price:"R$ 219,90"},
  {name:"Pijama Serena", category:"Pijamas", price:"R$ 239,90"},

  {name:"Saia Elisa", category:"Saias", price:"R$ 199,90"},
  {name:"Saia Aurora", category:"Saias", price:"R$ 229,90"}
];

let currentCategory = "";
let currentProduct = null;

function hidePages() {
  document.getElementById("home").style.display = "none";
  document.getElementById("categoryPage").classList.remove("active");
  document.getElementById("productPage").classList.remove("active");
}

function goHome() {
  hidePages();
  document.getElementById("home").style.display = "block";
  currentCategory = "";
  window.scrollTo(0, 0);
}

function openCategory(category) {
  currentCategory = category;
  hidePages();

  document.getElementById("categoryTitle").textContent = category;

  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";

  const filtered = products.filter(p => p.category === category);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">Novidades em breve.</div>';
  }

  filtered.forEach(product => {
    const card = document.createElement("article");
    card.className = "product";
    card.innerHTML = `
      <div class="product-photo">BIME</div>
      <div class="product-info">
        <h3>${product.name}</h3>
        <div class="price">${product.price}</div>
      </div>
    `;
    card.onclick = () => openProduct(product);
    grid.appendChild(card);
  });

  document.getElementById("categoryPage").classList.add("active");
  window.scrollTo(0, 0);
}

function openProduct(product) {
  currentProduct = product;
  hidePages();

  document.getElementById("detailName").textContent = product.name;
  document.getElementById("detailPrice").textContent = product.price;

  document.getElementById("productPage").classList.add("active");
  window.scrollTo(0, 0);
}

function backToCategory() {
  if (currentCategory) {
    openCategory(currentCategory);
  } else {
    goHome();
  }
}

function reserveProduct() {
  const whatsappNumber = "";

  if (!whatsappNumber) {
    alert("O WhatsApp comercial da Bime será configurado em breve.");
    return;
  }

  const message = encodeURIComponent(
    "Olá! Gostaria de reservar: " + currentProduct.name
  );

  window.open(
    "https://wa.me/" + whatsappNumber + "?text=" + message,
    "_blank"
  );
}
</script>

</body>
</html>
